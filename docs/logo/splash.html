<!doctype html>
<!--
  Source of VSim 2's splash screen (ui/src/main/resources/splash/). The version ("vx.y") and «Cargando…» are not
  here: the application paints them over the image (StartupSplash). To regenerate both PNGs:
    google-chrome --headless --hide-scrollbars --window-size=640,400 --virtual-time-budget=4000 \
      --force-device-scale-factor=1 --screenshot=vsim2-splash.png docs/logo/splash.html
    (and --force-device-scale-factor=2 --screenshot=vsim2-splash@2x.png)
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>VSim 2 splash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=JetBrains+Mono:wght@400;500&display=block">
<style>html, body { margin: 0; background: #1e1f22; overflow: hidden; } svg { display: block; }</style>
</head>
<body>
<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="lg-lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="lg-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="big-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="lg-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="lg-background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#1a1f27"/></linearGradient>
    <symbol id="logo" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#lg-background)" filter="url(#lg-lift)"/>
      <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#lg-shine)"/>
      <g stroke="#9aa6b6" stroke-width="10" stroke-linecap="round"><path d="M92 58v18M128 58v18M164 58v18M92 180v18M128 180v18M164 180v18"/></g>
      <rect x="66" y="76" width="124" height="104" rx="14" fill="#0f1318" stroke="#9aa6b6" stroke-width="5"/>
      <path d="M40 104h50l38 52 38-52h50" fill="none" stroke="#4be38a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#lg-glow)"/>
      <circle cx="128" cy="156" r="9" fill="#c9ffe0"/>
    </symbol>
    <pattern id="editor-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.2" fill="#393b40"/></pattern>
  </defs>
  <rect width="640" height="400" fill="#1e1f22"/>
  <rect width="400" height="400" fill="url(#editor-dots)"/>
  <rect x="390" width="250" height="400" fill="#18191c"/>
  <line x1="390" x2="390" y1="0" y2="400" stroke="#2b2d30"/>
  <g fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M84 140H213" stroke="#7cfc7c"/>
    <path d="M150 140V240H205" stroke="#7cfc7c"/>
    <path d="M84 260H205" stroke="#3d8b40"/>
    <path d="M170 260V160H213" stroke="#3d8b40"/>
    <path d="M270 150H330" stroke="#7cfc7c"/>
    <path d="M260 250H330" stroke="#3d8b40"/>
  </g>
  <circle cx="150" cy="140" r="4.5" fill="#7cfc7c"/>
  <circle cx="170" cy="260" r="4.5" fill="#3d8b40"/>
  <g stroke="#c9d1d9" stroke-width="2.4" fill="#2b2d30" stroke-linejoin="round">
    <path d="M200 125Q215 150 200 175" fill="none"/>
    <path d="M207 125Q250 125 270 150Q250 175 207 175Q222 150 207 125Z"/>
    <path d="M205 225H235A25 25 0 0 1 235 275H205Z"/>
  </g>
  <g font-family="JetBrains Mono" font-size="10" fill="#8a8f98"><text x="226" y="194">XOR</text><text x="221" y="294">AND</text></g>
  <g font-family="JetBrains Mono" font-weight="500">
    <rect x="40" y="126" width="44" height="28" rx="4" fill="#2b2d30" stroke="#c9d1d9" stroke-width="2"/>
    <text x="62" y="145" text-anchor="middle" font-size="14" fill="#dfe1e5">1</text>
    <text x="40" y="118" font-size="11" fill="#8a8f98">A</text>
    <rect x="40" y="246" width="44" height="28" rx="4" fill="#2b2d30" stroke="#c9d1d9" stroke-width="2"/>
    <text x="62" y="265" text-anchor="middle" font-size="14" fill="#dfe1e5">0</text>
    <text x="40" y="238" font-size="11" fill="#8a8f98">B</text>
    <circle cx="344" cy="150" r="12" fill="#7cfc7c" stroke="#c9ffe0" stroke-width="2.4" filter="url(#big-glow)"/>
    <circle cx="344" cy="250" r="12" fill="#2b2d30" stroke="#3d8b40" stroke-width="2.4"/>
    <text x="338" y="182" font-size="11" fill="#8a8f98">S</text>
    <text x="338" y="282" font-size="11" fill="#8a8f98">C</text>
  </g>
  <use href="#logo" x="412" y="92" width="56" height="56"/>
  <text x="414" y="200" font-family="Inter" font-weight="800" font-size="46" fill="#dfe1e5" letter-spacing="-1.5">VSim 2</text>
  <text x="416" y="224" font-family="Inter" font-size="12" fill="#8a8f98">Simulador de circuitos digitales</text>
</svg>
</body>
</html>
