<!doctype html>
<!--
  Source of VSim 2's splash screen (ui/src/main/resources/splash/). The version ("REV x.y") and «Cargando…» are not
  here: the application paints them over the image (StartupSplash). To regenerate both PNGs:
    google-chrome --headless --hide-scrollbars --window-size=640,400 --virtual-time-budget=4000 \
      --force-device-scale-factor=1 --screenshot=vsim2-splash.png docs/logo/splash.html
    (and --force-device-scale-factor=2 --screenshot=vsim2-splash@2x.png)
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>VSim 2 splash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400&display=block">
<style>html, body { margin: 0; background: #0e1218; overflow: hidden; } svg { display: block; }</style>
</head>
<body>
<svg id="chip" width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="lg-lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="lg-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="lg-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="lg-background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#1a1f27"/></linearGradient>
    <symbol id="logo" viewBox="0 0 256 256">
      <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#lg-background)" filter="url(#lg-lift)"/>
      <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#lg-shine)"/>
      <g stroke="#9aa6b6" stroke-width="10" stroke-linecap="round"><path d="M92 58v18M128 58v18M164 58v18M92 180v18M128 180v18M164 180v18"/></g>
      <rect x="66" y="76" width="124" height="104" rx="14" fill="#0f1318" stroke="#9aa6b6" stroke-width="5"/>
      <path d="M40 104h50l38 52 38-52h50" fill="none" stroke="#4be38a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#lg-glow)"/>
      <circle cx="128" cy="156" r="9" fill="#c9ffe0"/>
    </symbol>
    <pattern id="blueprint-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="rgba(120,160,220,.07)" stroke-width="1"/></pattern>
  </defs>
  <rect width="640" height="400" fill="#0e1218"/>
  <rect width="640" height="400" fill="url(#blueprint-grid)"/>
  <use href="#logo" x="30" y="26" width="40" height="40"/>
  <text x="78" y="53" font-family="Inter" font-weight="800" font-size="22" fill="#e6ebf1" letter-spacing="-.4">VSim 2</text>
  <text x="610" y="44" text-anchor="end" font-family="JetBrains Mono" font-size="10" fill="#6c7886" letter-spacing="1.5">HOJA DE DATOS</text>
  <line x1="30" x2="610" y1="80" y2="80" stroke="#232a34"/>
  <g id="pins"></g>
  <rect x="150" y="150" width="340" height="104" rx="6" fill="#16191e" stroke="#3a414c" stroke-width="2"/>
  <path d="M150 188A14 14 0 0 1 150 216" fill="#0e1218" stroke="#3a414c" stroke-width="2"/>
  <circle cx="172" cy="236" r="5" fill="#4be38a"/>
  <text x="320" y="204" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="30" fill="#d3dae3" letter-spacing="2">VSIM-2</text>
  <text x="320" y="226" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#7a8592" letter-spacing="2">SIMULADOR LÓGICO · DIP-14</text>
  <text x="30" y="352" font-family="Inter" font-size="12.5" fill="#8a95a3">Simulador de circuitos digitales para aprender</text>
</svg>
<script>
  const svgNamespace = "http://www.w3.org/2000/svg";
  const make = (name, attributes, parent, text) => {
    const element = document.createElementNS(svgNamespace, name);
    for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
    if (text !== undefined) element.textContent = text;
    parent.appendChild(element);
  };
  const pins = document.getElementById("pins");
  const bottomNames = ["1A", "1B", "1Y", "2A", "2B", "2Y", "GND"];
  const topNames = ["VCC", "4B", "4A", "4Y", "3B", "3A", "3Y"];
  for (let index = 0; index < 7; index++) {
    const x = 180 + index * 46;
    make("rect", { x: x - 8, y: 122, width: 16, height: 30, rx: 2, fill: "#9aa6b6" }, pins);
    make("rect", { x: x - 8, y: 252, width: 16, height: 30, rx: 2, fill: "#9aa6b6" }, pins);
    const label = { "text-anchor": "middle", "font-family": "JetBrains Mono", "font-size": 10.5, fill: "#7a8592" };
    make("text", { ...label, x, y: 112 }, pins, topNames[index]);
    make("text", { ...label, x, y: 300 }, pins, bottomNames[index]);
    const number = { "text-anchor": "middle", "font-family": "JetBrains Mono", "font-size": 8.5, fill: "#4a5462" };
    make("text", { ...number, x, y: 98 }, pins, 14 - index);
    make("text", { ...number, x, y: 313 }, pins, index + 1);
  }
</script>
</body>
</html>
