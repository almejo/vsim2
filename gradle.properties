# The four modules build and test at the same time (the full suite takes about half as long).
org.gradle.parallel=true

# CPD (copy/paste detector, see the root build): the build fails on duplicated code when this is true. The
# threshold: a run of this many tokens repeated (about 5-10 lines); conventions.md §3 «No duplication».
vsim.cpd.failOnViolation=true
vsim.cpd.minimumTokens=70
