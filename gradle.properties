# The four modules build and test at the same time (the full suite takes about half as long).
org.gradle.parallel=true

# CPD (copy/paste detector, see the root build): the build fails on duplicated code only when this is true. The
# duplication round (calidad-codigo T3) calibrates the threshold and turns it on.
vsim.cpd.failOnViolation=false
vsim.cpd.minimumTokens=100
