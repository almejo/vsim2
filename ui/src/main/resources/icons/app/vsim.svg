<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>VSim 2</title>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#1a1f27"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#background)" filter="url(#lift)"/>
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#shine)"/>
  <g stroke="#9aa6b6" stroke-width="10" stroke-linecap="round">
    <path d="M92 58v18M128 58v18M164 58v18M92 180v18M128 180v18M164 180v18"/>
  </g>
  <rect x="66" y="76" width="124" height="104" rx="14" fill="#0f1318" stroke="#9aa6b6" stroke-width="5"/>
  <path d="M40 104h50l38 52 38-52h50" fill="none" stroke="#4be38a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="128" cy="156" r="9" fill="#c9ffe0"/>
</svg>
