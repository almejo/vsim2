library.description.title=Descripción del componente
library.description.message=Descripción de «{0}» (se ve en Propiedades):
description.component.and=AND: la salida vale 1 solo si todas las entradas valen 1.\n\nCon «Ancho (bits)» mayor que 1 opera bit a bit y todos sus pines son buses de ese ancho. Una entrada en Z (sin conectar) no cuenta: la compuerta opera con las demás, y si todas están en Z la salida queda en Z. «Entradas» va de 2 a 8. La salida cambia «Retardo» unidades de tiempo después de que cambia una entrada.
description.component.or=OR: la salida vale 1 si al menos una entrada vale 1.\n\nCon «Ancho (bits)» mayor que 1 opera bit a bit y todos sus pines son buses de ese ancho. Una entrada en Z (sin conectar) no cuenta: la compuerta opera con las demás, y si todas están en Z la salida queda en Z. «Entradas» va de 2 a 8. La salida cambia «Retardo» unidades de tiempo después de que cambia una entrada.
description.component.xor=XOR: la salida vale 1 si un número impar de entradas vale 1 (paridad impar); con dos entradas, si son distintas.\n\nCon «Ancho (bits)» mayor que 1 opera bit a bit y todos sus pines son buses de ese ancho. Una entrada en Z (sin conectar) no cuenta: la compuerta opera con las demás, y si todas están en Z la salida queda en Z. «Entradas» va de 2 a 8. La salida cambia «Retardo» unidades de tiempo después de que cambia una entrada.
description.component.nand=NAND: la salida vale 0 solo si todas las entradas valen 1; es un AND con «Negar salida».\n\nCon «Ancho (bits)» mayor que 1 opera bit a bit y todos sus pines son buses de ese ancho. Una entrada en Z (sin conectar) no cuenta: la compuerta opera con las demás, y si todas están en Z la salida queda en Z. «Entradas» va de 2 a 8. La salida cambia «Retardo» unidades de tiempo después de que cambia una entrada.
description.component.nor=NOR: la salida vale 1 solo si todas las entradas valen 0; es un OR con «Negar salida».\n\nCon «Ancho (bits)» mayor que 1 opera bit a bit y todos sus pines son buses de ese ancho. Una entrada en Z (sin conectar) no cuenta: la compuerta opera con las demás, y si todas están en Z la salida queda en Z. «Entradas» va de 2 a 8. La salida cambia «Retardo» unidades de tiempo después de que cambia una entrada.
description.component.xnor=XNOR: la salida vale 1 si un número par de entradas vale 1 (paridad par); con dos entradas, si son iguales. Es un XOR con «Negar salida».\n\nCon «Ancho (bits)» mayor que 1 opera bit a bit y todos sus pines son buses de ese ancho. Una entrada en Z (sin conectar) no cuenta: la compuerta opera con las demás, y si todas están en Z la salida queda en Z. «Entradas» va de 2 a 8. La salida cambia «Retardo» unidades de tiempo después de que cambia una entrada.
description.component.buffer=Buffer: copia su entrada a la salida.\n\nSirve para retrasar una señal «Retardo» unidades de tiempo. Con «Ancho (bits)» mayor que 1 copia un bus completo. Un bit en Z sale en Z.
description.component.not=NOT: invierte su entrada (0 da 1 y 1 da 0); es un Buffer con «Negar salida».\n\nCon «Ancho (bits)» mayor que 1 invierte cada bit de un bus. Un bit en Z sale en Z. La salida cambia «Retardo» unidades de tiempo después de la entrada.
description.component.tri-state=Buffer triestado: con la entrada de control en 1, la salida copia la entrada; si no, la salida queda en Z (suelta el cable).\n\nCon «Ancho (bits)» mayor que 1 la entrada y la salida son buses de ese ancho y el control (abajo, de 1 bit) enciende o apaga el bus entero. Con «Negar salida» la salida es la entrada invertida bit a bit mientras está encendido (es el Inversor controlado); apagado sigue en Z. La entrada de control sin conectar, en Z o en conflicto cuenta como apagada. Así varios buffers triestado pueden manejar el mismo cable, siempre que solo uno esté encendido a la vez: dos encendidos con valores distintos son un cortocircuito. La salida cambia «Retardo» unidades de tiempo después de una entrada.
description.component.flip-flop-data=Flip-flop D: guarda un bit. En el flanco de bajada del reloj (cuando pasa de 1 a 0), Q toma el valor que tiene D en ese instante y Q̅ (abajo de Q) el contrario.\n\nEntre flancos D puede cambiar sin efecto. Parte con Q = 0 y Q̅ = 1. Q y Q̅ cambian «Retardo» unidades de tiempo después del flanco. Si D está en Z en el flanco, Q y Q̅ quedan en Z. Solo cuenta un paso directo de 1 a 0: un reloj que pasa por Z no da flanco.
description.component.flip-flop-data.showInverted.false=«Mostrar Q̅» apagado: no hay Q̅, solo D, Q y el reloj. Así se abren los flip-flops D de los circuitos guardados antes de que existiera Q̅, para que un cable que baja derecho desde Q no quede unido a Q̅. Si lo enciendes, revisa que ningún cable pase por el punto justo abajo de Q.
description.component.flip-flop-jk=Flip-flop JK: guarda un bit. En el flanco de bajada del reloj (de 1 a 0) mira J y K: J = 0 y K = 0 lo deja igual, J = 0 y K = 1 lo pone en 0, J = 1 y K = 0 lo pone en 1, y J = 1 y K = 1 lo invierte. Q̅ es el contrario de Q.\n\nEntre flancos J y K pueden cambiar sin efecto. Parte con Q = 0 y Q̅ = 1. Q y Q̅ cambian «Retardo» unidades de tiempo después del flanco. Si J o K están en Z (sin conectar) o en conflicto en el flanco, Q y Q̅ quedan en Z hasta un flanco con J distinto de K. Solo cuenta un paso directo de 1 a 0: un reloj que pasa por Z no da flanco.
description.component.flip-flop-t=Flip-flop T: guarda un bit y lo invierte cuando se le pide. En el flanco de bajada del reloj (de 1 a 0), con T = 1 Q se invierte; con T = 0 queda igual. Q̅ es el contrario de Q.\n\nCon T en 1, Q cambia en cada flanco: divide la frecuencia del reloj por 2 y sirve para armar contadores. Parte con Q = 0 y Q̅ = 1. Q y Q̅ cambian «Retardo» unidades de tiempo después del flanco. T sin conectar no cuenta como 1: si T está en Z o en conflicto en el flanco, Q y Q̅ quedan en Z, y como invertir Z da Z, siguen así hasta «Reiniciar». Solo cuenta un paso directo de 1 a 0: un reloj que pasa por Z no da flanco.
description.component.flip-flop-sr=Flip-flop SR: guarda un bit. En el flanco de bajada del reloj (de 1 a 0) mira S (poner en 1) y R (poner en 0): S = 0 y R = 0 lo deja igual, S = 1 y R = 0 lo pone en 1, y S = 0 y R = 1 lo pone en 0. Q̅ es el contrario de Q.\n\nS = 1 y R = 1 a la vez es el estado prohibido: Q y Q̅ quedan los dos en 0 (lo que muestra un latch hecho con compuertas NOR), así que Q̅ deja de ser el contrario de Q. Siguen así hasta un flanco con S distinto de R; S = 0 y R = 0 los deja igual.\n\nParte con Q = 0 y Q̅ = 1. Q y Q̅ cambian «Retardo» unidades de tiempo después del flanco. Si S o R están en Z (sin conectar) o en conflicto en el flanco, Q y Q̅ quedan en Z. Solo cuenta un paso directo de 1 a 0: un reloj que pasa por Z no da flanco.
description.component.clock=Reloj: una onda cuadrada que cambia sola mientras simula.\n\nParte en 0: queda en 0 «Tiempo en bajo» unidades de tiempo, después en 1 «Tiempo en alto» unidades, y así sucesivamente. Cada bajada de 1 a 0 es el flanco que usan los flip-flops D, JK, T y SR, el registro, el contador y la RAM.
description.component.switch=Interruptor: entrega 1, 0 o Z; un clic lo cambia mientras simula.\n\n«Valor» es lo que entrega al empezar. Un clic pasa de 1 a 0 y de 0 a 1; si estaba en Z, pasa a 1. Cambia sin retardo.\n\nCon «Ancho (bits)» mayor que 1 es una fila de bits (el más significativo a la izquierda) con una sola salida de bus. «Valor» es entonces un número (0b…, 0x… o decimal) que cabe en el ancho; solo hay 0 y 1, no Z. Un clic en un bit cambia solo ese bit; al pasar el puntero se ve el valor en binario, hexadecimal y decimal. Al rotarlo la salida cambia de lado y la fila sigue derecha.
description.component.constant=Constante: entrega siempre el mismo valor, de «Ancho (bits)» bits.\n\nEl valor se pone una sola vez, al empezar la simulación, y un clic no lo cambia. Se escribe en binario (0b1010), hexadecimal (0xFF) o decimal, también negativo en complemento a dos (-3); un valor que no cabe en el ancho se rechaza. «Mostrar como» cambia solo cómo se ve.
description.component.led=LED: se enciende cuando su entrada vale 1.\n\nCon 0 o con Z (sin conectar) queda apagado. «Color» cambia solo cómo se ve.\n\nCon «Ancho (bits)» mayor que 1 es una fila de luces, una por bit (la del bit más significativo a la izquierda), con una sola entrada de bus. Cada luz se enciende solo con 1: con 0, con Z o en conflicto queda apagada. Al pasar el puntero se ve qué bit es y el valor. Al rotarlo la entrada cambia de lado y la fila sigue derecha.
description.component.seven-segments-display=Display de 7 segmentos: muestra un dígito hexadecimal, de 0 a F, a partir de 4 bits.\n\nLos 4 bits llegan por los pines de arriba (el de más a la derecha es el bit 0) o por el bus de 4 bits de abajo. Si el bus trae algún bit que no esté en Z, se muestra el bus; si está todo en Z o sin conectar, se muestran los pines de arriba. Un dígito con algún bit en Z o en conflicto muestra un guion.
description.component.seven-segments-display-double=Display de 7 segmentos doble: muestra dos dígitos hexadecimales, de 00 a FF, a partir de 8 bits.\n\nLos 8 bits llegan por los pines de arriba (el de más a la derecha es el bit 0) o por el bus de 8 bits de abajo. Si el bus trae algún bit que no esté en Z, se muestra el bus; si está todo en Z o sin conectar, se muestran los pines de arriba. Un dígito con algún bit en Z o en conflicto muestra un guion.
description.component.time-diagram=Diagrama de tiempo: dibuja cómo cambian sus 4 entradas a lo largo del tiempo.\n\nToma una muestra cada «Intervalo de muestreo» unidades de tiempo y guarda las últimas «Historial (muestras)»: un pulso más corto que el intervalo puede no verse. Z se dibuja como una línea al medio y un conflicto en rojo.
description.component.input-pin=Pin de entrada: al crear un componente se convierte en una de sus entradas; mientras pruebas el circuito funciona como un interruptor.\n\nSu etiqueta es el nombre del pin y «Ancho (bits)» su ancho (un bus si es mayor que 1). En un bus, doble clic para escribir su valor. «Valor» es lo que entrega al empezar (1, 0 o Z en todos sus bits).
description.component.output-pin=Pin de salida: al crear un componente se convierte en una de sus salidas; mientras pruebas el circuito muestra su valor como un LED.\n\nSu etiqueta es el nombre del pin y «Ancho (bits)» su ancho (un bus si es mayor que 1). En un bus, el valor se escribe en el formato de «Mostrar como».
description.component.bus-splitter=Separador de bus: separa un bus de «Ancho (bits)» bits en un cable por bit.\n\nEl bus entra arriba a la izquierda y el bit 0 sale por b0, el pin de más arriba. Copia sin retardo; un bit en Z sale en Z.
description.component.bus-joiner=Unión de bus: junta un cable por bit en un bus de «Ancho (bits)» bits.\n\nEl bit 0 entra por b0, el pin de más arriba, y el bus sale arriba a la derecha. Junta sin retardo; un bit en Z (sin conectar) queda en Z en el bus.
description.component.tunnel-in=Túnel (entrada): une cables por nombre sin dibujarlos. La señal que llega a esta entrada sale por todas las salidas del mismo nombre en este circuito.\n\nCada nombre tiene una sola entrada, y sus salidas toman su color. Lleva un cable o un bus completo. Los nombres no cruzan el borde de un componente propio.
description.component.tunnel-out=Túnel (salida): entrega la señal de la entrada del mismo nombre en este circuito (un cable o un bus completo).\n\nToma el color de su entrada; sin entrada se ve gris y aparece en Problemas.
description.component.adder=Sumador: suma A + B + Cin; S es el resultado y Cout el acarreo que sale del bit más alto.\n\nS tiene el ancho elegido en «Ancho (bits)»: lo que no cabe se pierde y la suma da la vuelta. Cin entra por arriba y Cout sale por abajo. Cin sin conectar vale 0. Si A o B tienen algún bit en Z o en conflicto, o Cin está en conflicto, S y Cout quedan en Z. Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.alu=ALU: opera A y B según OP (3 bits) y muestra adentro la operación.\n\nOP: 000 A + B, 001 A − B, 010 A AND B, 011 A OR B, 100 A XOR B, 101 NOT A, 110 A << 1, 111 A >> 1 (lógico). Y es el resultado; Z = 1 si Y es 0, N es el bit más alto de Y, C es el acarreo de la suma, el préstamo de la resta (1 si A < B sin signo) o el bit que sale al desplazar, y V el desborde con signo de la suma o la resta (en las demás operaciones C y V valen 0).\n\nSi OP, o un operando que la operación usa, tiene algún bit en Z o en conflicto, todas las salidas quedan en Z y adentro se ve «?». Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.comparator=Comparador: compara A con B; exactamente una de las salidas A<B, A=B y A>B vale 1.\n\n«Números» elige si A y B se leen sin signo o con signo. Si A o B tienen algún bit en Z o en conflicto, las tres salidas quedan en Z. Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.mux=Multiplexor: deja pasar una de sus entradas. Y = D0 si S = 0 y D1 si S = 1.\n\nCon 4 u 8 entradas, S tiene 2 o 3 bits y elige entre D0 y D3 o D7. Solo importa la entrada elegida: si ella o S tienen algún bit en Z o en conflicto, Y queda en Z. Y cambia «Retardo» unidades de tiempo después de una entrada.
description.component.decoder=Decodificador: enciende una sola salida, la Y cuyo número es A.\n\nCon EN = 1, la salida número A vale 1 y las demás 0; con EN = 0 todas valen 0, aunque A no esté definida. EN sin conectar vale 1. Si A tiene algún bit en Z o en conflicto con EN = 1, o EN está en conflicto, todas las salidas quedan en Z. «Bits de entrada» va de 1 a 4 (2 a 16 salidas). Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.demux=Demultiplexor: manda D a una de sus salidas, la Y cuyo número es S.\n\nLa salida elegida vale D y todas las demás valen 0. Con «Salidas» = 2, 4 u 8, S tiene 1, 2 o 3 bits. Si S tiene algún bit en Z o en conflicto, todas las salidas quedan en Z; si solo D está indefinida, queda en Z la salida elegida y las demás siguen en 0. Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.priority-encoder=Codificador con prioridad: dice cuál es la entrada más alta que vale 1.\n\nA es el número de la entrada I con índice más alto en 1 y V («válido») vale 1; si ninguna vale 1, A = 0 y V = 0 (V distingue ese caso de «la entrada 0 está en 1»). Una entrada sin conectar vale 0. Se miran de la más alta a la más baja: una entrada en conflicto o con valor indefinido solo importa si ninguna más alta vale 1, y entonces A y V quedan en Z. «Entradas» es 2, 4, 8 o 16. Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.register=Registro: guarda un valor de «Ancho (bits)» bits.\n\nEn el flanco de bajada de CLK (de 1 a 0), con EN = 1, Q toma el valor de D (Z si D tiene algún bit en Z o en conflicto). CLR = 1 lo deja en 0 al instante, sin esperar el reloj. Sin conectar, EN vale 1 y CLR vale 0; un conflicto en EN o en CLR deja el valor como estaba. Parte en 0 y Q cambia «Retardo» unidades de tiempo después.\n\nMuestra su contenido en el formato de «Mostrar como»; en binario, los dígitos van en grupos de 4. Con más de 16 bits el binario va en dos líneas (el bit más alto arriba a la izquierda) y el registro es una unidad más alto, así que EN, CLR y CLK bajan una unidad.
description.component.counter=Contador: cuenta hacia arriba.\n\nEn el flanco de bajada de CLK (de 1 a 0): con LD = 1 carga D; si no, con EN = 1 suma 1 (después del máximo vuelve a 0). CLR = 1 lo deja en 0 al instante. C («fin de cuenta») vale 1 mientras Q es todo unos y EN = 1, para encadenar contadores. Sin conectar, LD y CLR valen 0 y EN vale 1; un conflicto en LD, EN o CLR deja la cuenta como estaba. Parte en 0, Q cambia «Retardo» unidades de tiempo después y muestra la cuenta en el formato de «Mostrar como».
description.component.ram=RAM: una tabla de palabras numeradas que se lee y se escribe; el número de una palabra es su dirección.\n\nLectura: Q muestra la palabra número A «Retardo» unidades de tiempo después de que A cambia, sin esperar el reloj.\n\nEscritura «Con reloj»: en el flanco de bajada de CLK (de 1 a 0), con WE = 1 y CS = 1, la palabra A toma el valor de D. A, D, WE y CS se miran en ese instante.\n\nSin conectar, CS vale 1 y WE vale 0: funciona sin cablear CS y un WE olvidado nunca escribe. Con CS = 0 no escribe y Q queda en Z; un conflicto en CS deja Q en Z y no escribe, y un conflicto en WE no escribe. Una dirección con algún bit en Z o en conflicto se lee como Z (todos los bits) y no escribe. Un dato D con algún bit en Z o en conflicto se guarda como una palabra en Z, que se lee en Z hasta que se vuelve a escribir.\n\nParte con su contenido inicial, el del editor de contenido (doble clic). Achicar «Palabras» o «Ancho (bits)» nunca borra el contenido: lo que no cabe queda guardado, oculto, y vuelve a verse al agrandar la memoria. Dentro de un componente propio, la memoria parte con las palabras guardadas en el componente (el enlace a un archivo no viaja dentro).
description.component.rom=ROM: una tabla de palabras numeradas que solo se lee; el número de una palabra es su dirección.\n\nQ muestra la palabra número A «Retardo» unidades de tiempo después de que A cambia (no tiene reloj). Con CS = 0, o con un conflicto en CS, Q queda en Z; sin conectar, CS vale 1. Una dirección con algún bit en Z o en conflicto se lee como Z (todos los bits).\n\nSu contenido se escribe en el editor de contenido (doble clic) o viene de un archivo enlazado; la simulación nunca lo cambia. Achicar «Palabras» o «Ancho (bits)» nunca borra el contenido: lo que no cabe queda guardado, oculto, y vuelve a verse al agrandar la memoria. Dentro de un componente propio, la memoria parte con las palabras guardadas en el componente (el enlace a un archivo no viaja dentro).
description.component.comparator.signedness.signed=«Números: Con signo»: A y B se leen en complemento a dos, con el bit más alto como signo (en 8 bits, 0xFF es −1, menor que 0).
description.component.ram.write.level=«Escritura: Sin reloj»: no hay CLK. La palabra A toma el valor de D todo el tiempo que WE = 1 y CS = 1: si A o D cambian mientras tanto, se escribe la nueva dirección o el nuevo valor.
description.component.ram.data.shared=«Datos: Un solo bus D»: no hay Q; D es un solo pin de ida y vuelta. La RAM entrega la palabra A por D solo con CS = 1 y WE = 0 (WE sin conectar cuenta como 0) y lo suelta (Z) al instante en los demás casos, así otro circuito puede poner el dato para escribir. Varias memorias o un registro pueden compartir el mismo bus.
description.component.ram.connection.pins=«Conexión: Pines sueltos»: A, D y Q tienen un pin de 1 bit por cada bit (A0, A1…, el bit 0 primero). Basta un bit en Z o en conflicto para que la palabra completa cuente como indefinida.
description.component.rom.connection.pins=«Conexión: Pines sueltos»: A y Q tienen un pin de 1 bit por cada bit (A0, A1…, el bit 0 primero). Basta un bit de A en Z o en conflicto para que la dirección cuente como indefinida.
description.component.ram.link.set=Enlazada a un archivo: el contenido inicial viene de ese archivo, y VSim lo vuelve a leer cuando cambia. VSim nunca escribe el archivo (se edita en el editor externo); lo que la simulación escribe queda solo en la memoria que simula.
description.component.rom.link.set=Enlazada a un archivo: el contenido viene de ese archivo, y VSim lo vuelve a leer cuando cambia. VSim nunca escribe el archivo: se edita en el editor externo.
description.component.subtractor=Restador: calcula A − B − Bin; D es la diferencia y Bout vale 1 cuando el resultado, leído sin signo, necesitó pedir prestado (A es menor que B + Bin).\n\nD tiene el ancho elegido en «Ancho (bits)»: lo que no cabe se pierde y la resta da la vuelta (0 − 1 da todos unos). Bin entra por arriba y Bout sale por abajo. Bin sin conectar vale 0. Si A o B tienen algún bit en Z o en conflicto, o Bin está en conflicto, D y Bout quedan en Z. Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.negator=Negador: Y es A con el signo cambiado, en complemento a dos (−A).\n\nCon 8 bits, 5 da 251 (0xFB, que es −5), 0 da 0 y −128 (0x80) da −128 otra vez, porque +128 no cabe. Si A tiene algún bit en Z o en conflicto, Y queda en Z. La salida cambia «Retardo» unidades de tiempo después de A.
description.component.multiplier=Multiplicador: multiplica A por B. El producto ocupa el doble de bits, así que sale en dos mitades del ancho elegido: P es la mitad baja y H la mitad alta.\n\nPor ejemplo, con 8 bits 200 × 100 = 20000 = 0x4E20: P vale 0x20 y H vale 0x4E. Nada se pierde ni da la vuelta, también con 32 bits. «Números» elige cómo se leen A y B. Si A o B tienen algún bit en Z o en conflicto, P y H quedan en Z. Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.multiplier.signedness.unsigned=«Números: Sin signo»: A y B son números positivos de 0 a 2^N − 1.
description.component.multiplier.signedness.signed=«Números: Con signo»: A y B se leen en complemento a dos. P y H son el producto de 2N bits también en complemento a dos: −1 × −1 da 1 (P = 1, H = 0) y −1 × 2 da −2 (P = 0xFE y H = 0xFF con 8 bits).
description.component.divider=Divisor: divide A (dividendo) entre B (divisor). Q es el cociente, R el resto y E avisa de la división por cero.\n\nEs una división entera: 250 ÷ 7 da Q = 35 y R = 5. Si B vale 0 no se puede dividir: Q vale 0, R vale A y E vale 1 (en cualquier otro caso E vale 0). «Números» elige cómo se leen A y B. Si A o B tienen algún bit en Z o en conflicto, Q, R y E quedan en Z. Las salidas cambian «Retardo» unidades de tiempo después de una entrada.
description.component.divider.signedness.unsigned=«Números: Sin signo»: A y B son números positivos de 0 a 2^N − 1.
description.component.divider.signedness.signed=«Números: Con signo»: A y B se leen en complemento a dos. El cociente se trunca hacia cero y el resto lleva el signo del dividendo, como en Java o C: −7 ÷ 2 da Q = −3 y R = −1. El caso −128 ÷ −1 con 8 bits daría +128, que no cabe: Q da la vuelta y vale −128, con R = 0 y E = 0.
description.component.shifter=Desplazador: mueve los bits de A hacia un lado tantas posiciones como diga S (un número sin signo); Y es el resultado.\n\nS tiene los bits justos para contar de 0 a N − 1 (3 bits con 8). Con S = 0, Y es igual a A. Dejar S fijo con una Constante da un desplazamiento fijo; por ejemplo, x >> 1 es un desplazador a la derecha con S = 1. Si el ancho no es potencia de 2, S puede valer N o más: los desplazamientos sacan todos los bits (el aritmético deja copias del signo) y la rotación da vueltas completas (módulo N). Si A o S tienen algún bit en Z o en conflicto, Y queda en Z. La salida cambia «Retardo» unidades de tiempo después de una entrada.\n\nLos símbolos son los de Verilog: >> es el lógico (entran ceros) y >>> el aritmético (entra el signo), al revés que en Java y JavaScript.
description.component.shifter.shiftType.logical-left=«Tipo: Lógico a la izquierda» (<<): los bits suben S posiciones, los bits altos se pierden y entran ceros por la derecha. Equivale a multiplicar por 2^S.
description.component.shifter.shiftType.logical-right=«Tipo: Lógico a la derecha» (>>): los bits bajan S posiciones, los bajos se pierden y entran ceros por la izquierda. Equivale a dividir sin signo entre 2^S.
description.component.shifter.shiftType.arithmetic-right=«Tipo: Aritmético a la derecha» (>>>): los bits bajan S posiciones, pero entra una copia del bit más alto (el signo) en vez de ceros; así un número negativo en complemento a dos sigue negativo.
description.component.shifter.shiftType.rotate-left=«Tipo: Rotar a la izquierda»: los bits suben S posiciones y los que salen por arriba vuelven a entrar por la derecha; no se pierde ninguno.
description.component.shifter.shiftType.rotate-right=«Tipo: Rotar a la derecha»: los bits bajan S posiciones y los que salen por abajo vuelven a entrar por la izquierda; no se pierde ninguno.
description.component.bit-counter=Contador de unos: Y es cuántos de los bits de A valen 1.\n\nY tiene los bits justos para contar de 0 a N (4 bits con 8): con A = 0 da 0 y con todos los bits en 1 da N. Sirve, por ejemplo, para saber la paridad o el peso de una palabra. Si A tiene algún bit en Z o en conflicto, Y queda en Z. La salida cambia «Retardo» unidades de tiempo después de A.
description.component.inverter-controlled=Inversor controlado: con la entrada de control en 1, la salida es la entrada invertida (0 da 1 y 1 da 0); si no, la salida queda en Z (suelta el cable). Es un Buffer triestado con «Negar salida».\n\nCon «Ancho (bits)» mayor que 1 invierte cada bit de un bus y el control (abajo, de 1 bit) lo enciende o apaga entero. La entrada de control sin conectar, en Z o en conflicto cuenta como apagada. Varios pueden manejar el mismo cable si solo uno está encendido a la vez. La salida cambia «Retardo» unidades de tiempo después de una entrada.
description.component.bit-extender=Extensor de bits: cambia el ancho de un bus; la entrada «in» tiene «Ancho de entrada» bits y la salida «out» «Ancho de salida» bits.\n\nSi la salida es más ancha, los bits nuevos de arriba son ceros o copias del bit más alto de la entrada, según «Relleno». Si es más angosta se conservan solo los bits de abajo y los de arriba se pierden, sea cual sea el relleno (de 8 bits a 3 quedan los 3 más bajos). Es solo cableado: no tiene retardo. Si algún bit de la entrada está en Z o en conflicto, toda la salida queda en Z.
description.component.bit-extender.fill.zeros=«Relleno: Ceros»: los bits nuevos valen 0; sirve para números sin signo (11110101 pasa de 8 a 16 bits como 0000000011110101).
description.component.bit-extender.fill.sign=«Relleno: Signo»: los bits nuevos copian el bit más alto de la entrada; sirve para números con signo en complemento a dos (11110101, que vale -11, pasa de 8 a 16 bits como 1111111111110101, que sigue valiendo -11).
description.component.bit-selector=Selector de bits: saca de la entrada «in» el grupo número S de «Ancho de salida» bits; el grupo 0 son los bits de abajo.\n\nPor ejemplo, un bus de 8 bits con salida de 4 bits tiene 2 grupos: S = 0 da los 4 bits bajos y S = 1 los 4 altos. S tiene los bits justos para numerar los grupos (al menos 1). Si el último grupo no llega completo, los bits que faltan valen 0; un S que apunta a un grupo que no existe da todo 0. Si «in» o S tienen algún bit en Z o en conflicto (S sin conectar también), «out» queda en Z. La salida cambia «Retardo» unidades de tiempo después de una entrada.

