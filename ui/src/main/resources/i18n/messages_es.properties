help.component.adder=Suma A + B + Cin. S es el resultado, del ancho elegido en «Ancho (bits)», y Cout el acarreo que sale del bit más alto. Cin sin conectar vale 0. Si A o B tienen algún bit en Z o en conflicto, S y Cout quedan en Z.

# Task 2: formats and bus values
choice.format.signed=Decimal con signo
