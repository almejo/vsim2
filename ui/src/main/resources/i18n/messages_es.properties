help.component.decoder=Enciende una sola salida: con EN = 1, la salida Y cuyo número es A vale 1 y las demás 0; con EN = 0 todas valen 0. EN sin conectar vale 1. Si A tiene algún bit en Z o en conflicto, todas las salidas quedan en Z.

# Task 5: register and counter
component.register=Registro
component.counter=Contador
help.component.register=Guarda un valor de «Ancho (bits)» bits. En el flanco de bajada de CLK, con EN = 1, Q toma el valor de D (Z si D tiene algún bit en Z o en conflicto). CLR = 1 lo deja en 0 al instante, sin esperar el reloj. Sin conectar, EN vale 1 y CLR vale 0. Parte en 0 y muestra su contenido en el formato de «Mostrar como».
help.component.counter=Cuenta hacia arriba. En el flanco de bajada de CLK: con LD = 1 carga D; si no, con EN = 1 suma 1 (después del máximo vuelve a 0). CLR = 1 lo deja en 0 al instante. C («fin de cuenta») vale 1 mientras Q es todo unos y EN = 1, para encadenar contadores. Sin conectar, LD y CLR valen 0 y EN vale 1. Parte en 0 y muestra la cuenta en el formato de «Mostrar como».

