# Task 3: ALU and comparator
component.alu=ALU
help.component.alu=Opera A y B según OP (3 bits) y muestra la operación adentro: 000 A + B, 001 A − B, 010 A AND B, 011 A OR B, 100 A XOR B, 101 NOT A, 110 A << 1, 111 A >> 1. Y es el resultado; Z = 1 si Y es 0, N es el bit más alto de Y, C es el acarreo de la suma, el préstamo de la resta (1 si A < B sin signo) o el bit que sale al desplazar, y V el desborde con signo de la suma o la resta. Si OP, o un operando que la operación usa, tiene algún bit en Z o en conflicto, todas las salidas quedan en Z y adentro se ve «?».
component.comparator=Comparador
help.component.comparator=Compara A con B: exactamente una de las salidas A<B, A=B y A>B vale 1. «Números» elige si A y B se leen sin signo o con signo (complemento a dos). Si A o B tienen algún bit en Z o en conflicto, las tres salidas quedan en Z.
parameter.signedness=Números
choice.signedness.unsigned=Sin signo
choice.signedness.signed=Con signo

# Task 4: mux and decoder
component.mux=Multiplexor
component.decoder=Decodificador
parameter.inputs=Entradas
