karnaugh.groups.why=¿Por qué?
karnaugh.groups.rules=Reglas
karnaugh.why.intro.sop=Cada celda es un producto con todas las variables. Sumamos las celdas del grupo y usamos P·Q' + P·Q = P·(Q' + Q) = P, porque Q' + Q = 1: la variable que cambia se va.
karnaugh.why.intro.pos=Cada celda de 0 es una suma con todas las variables. Multiplicamos las sumas del grupo y usamos (P + Q)·(P + Q') = P + Q·Q' = P, porque Q·Q' = 0: la variable que cambia se va.
karnaugh.why.cells=Celdas: {0}
karnaugh.why.dontCare.one=La celda {0} es X («no importa»): aquí la tomamos como {1} para agrandar el grupo.
karnaugh.why.dontCare.many=Las celdas {0} son X («no importa»): aquí las tomamos como {1} para agrandar el grupo.
karnaugh.why.list={0} y {1}
karnaugh.why.step=Se va {0}:
karnaugh.why.combine.sop={0} + {1} = {2}·({3}'' + {3}) = {2}
karnaugh.why.combine.sopLast={0} + {1} = 1
karnaugh.why.combine.pos={0}·{1} = {2} + {3}·{3}'' = {2}
karnaugh.why.combine.posLast={0}·{1} = 0
karnaugh.why.single=Una sola celda: no hay nada que simplificar; el término lleva todas las variables.
karnaugh.why.result=Queda {0}.
karnaugh.rules.1=Se agrupan solo los {0} (y las X, si ayudan a hacer un grupo más grande); nunca un {1}.
karnaugh.rules.2=Cada grupo es un rectángulo de 1, 2, 4, 8 o 16 celdas: sirven las líneas, pero no las formas de L ni las diagonales.
karnaugh.rules.3=Son vecinas las celdas de arriba, abajo, izquierda y derecha, y los bordes se tocan: la última columna es vecina de la primera, y la última fila de la primera.
karnaugh.rules.4=Cada grupo, lo más grande posible: mientras más grande es, menos variables le quedan.
karnaugh.rules.5=Los menos grupos posible para cubrir todos los {0}; los grupos pueden traslaparse.
karnaugh.rules.6=Las X son opcionales: se usan si agrandan un grupo, pero no hace falta cubrirlas.
