karnaugh.groups.why=Why?
karnaugh.groups.rules=Rules
karnaugh.why.intro.sop=Each cell is a product with every variable. We add the cells of the group and use P·Q' + P·Q = P·(Q' + Q) = P, because Q' + Q = 1: the variable that changes goes away.
karnaugh.why.intro.pos=Each 0 cell is a sum with every variable. We multiply the sums of the group and use (P + Q)·(P + Q') = P + Q·Q' = P, because Q·Q' = 0: the variable that changes goes away.
karnaugh.why.cells=Cells: {0}
karnaugh.why.dontCare.one=Cell {0} is X (“don’t care”): here we take it as {1} to make the group bigger.
karnaugh.why.dontCare.many=Cells {0} are X (“don’t care”): here we take them as {1} to make the group bigger.
karnaugh.why.list={0} and {1}
karnaugh.why.step={0} goes away:
karnaugh.why.combine.sop={0} + {1} = {2}·({3}'' + {3}) = {2}
karnaugh.why.combine.sopLast={0} + {1} = 1
karnaugh.why.combine.pos={0}·{1} = {2} + {3}·{3}'' = {2}
karnaugh.why.combine.posLast={0}·{1} = 0
karnaugh.why.single=A single cell: there is nothing to simplify; the term keeps every variable.
karnaugh.why.result={0} is left.
karnaugh.rules.1=Group only the {0}s (and the Xs, if they help make a group bigger); never a {1}.
karnaugh.rules.2=Each group is a rectangle of 1, 2, 4, 8 or 16 cells: lines are fine, L shapes and diagonals are not.
karnaugh.rules.3=Neighbours are the cells above, below, left and right, and the edges touch: the last column is a neighbour of the first, and the last row of the first.
karnaugh.rules.4=Each group as big as possible: the bigger it is, the fewer variables it keeps.
karnaugh.rules.5=As few groups as possible to cover every {0}; groups may overlap.
karnaugh.rules.6=Xs are optional: use them if they make a group bigger, but they need not be covered.
