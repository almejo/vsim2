help.component.alu=Combines A and B as OP (3 bits) says and shows the operation inside: 000 A + B, 001 A − B, 010 A AND B, 011 A OR B, 100 A XOR B, 101 NOT A, 110 A << 1, 111 A >> 1. Y is the result; Z = 1 when Y is 0, N is the top bit of Y, C is the carry of an addition, the borrow of a subtraction (1 when A < B unsigned) or the bit shifted out, and V the signed overflow of an addition or subtraction. When OP, or an operand the operation reads, has a bit in Z or in conflict, every output is Z and the body shows "?".
component.comparator=Comparator
help.component.comparator=Compares A with B: exactly one of the outputs A<B, A=B and A>B is 1. "Numbers" says whether A and B are read unsigned or signed (two's complement). When A or B has a bit in Z or in conflict, the three outputs are Z.
parameter.signedness=Numbers
choice.signedness.unsigned=Unsigned
choice.signedness.signed=Signed

# Task 4: mux and decoder
component.mux=Multiplexer
component.decoder=Decoder
parameter.inputs=Inputs
choice.inputs.2=2
choice.inputs.4=4
parameter.inputBits=Input bits
help.component.mux=Lets one of its inputs through: Y = D0 when S = 0 and D1 when S = 1 (with 4 inputs, S has 2 bits and picks D0 to D3). Only the picked input matters: when it or S has a bit in Z or in conflict, Y is Z.
help.component.decoder=Turns on a single output: with EN = 1, the output Y numbered A is 1 and the others 0; with EN = 0 they are all 0. An unconnected EN counts as 1. When A has a bit in Z or in conflict, every output is Z.

# Task 5: register and counter
component.register=Register
component.counter=Counter
help.component.register=Stores a value of "Width (bits)" bits. On the falling edge of CLK, with EN = 1, Q takes D (Z when D has a bit in Z or in conflict). CLR = 1 clears it to 0 at once, without waiting for the clock. Unconnected, EN counts as 1 and CLR as 0. Starts at 0 and shows its contents in the "Show as" format.
help.component.counter=Counts up. On the falling edge of CLK: with LD = 1 it loads D; otherwise, with EN = 1 it adds 1 (after the maximum it goes back to 0). CLR = 1 clears it to 0 at once. C ("terminal count") is 1 while Q is all ones and EN = 1, to chain counters. Unconnected, LD and CLR count as 0 and EN as 1. Starts at 0 and shows the count in the "Show as" format.

