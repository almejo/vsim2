component.uart-16550=UART 16550
description.component.uart-16550=UART 16550: the standard serial port of a PC and of QEMU's RISC-V «virt» board, with its eight registers on a CPU bus.\n\nTo read, put the register's address on A with CS and RD at 1: Q shows it (without CS and RD, Q lets go). To write, put the byte on D with CS and WR at 1. What a read changes (taking the byte off RBR, clearing LSR's error) and the write happen on the CLK edge. Unconnected, CS is 1 and RD, WR and CLR are 0.\n\nRegisters: 0 RBR/THR (received / to send), 1 IER, 2 IIR/FCR, 3 LCR (with its DLAB bit on, 0 and 1 are the divisor DLL/DLM), 4 MCR, 5 LSR (bit 0: a byte is there; bit 5: ready to send), 6 MSR and 7 SCR. A program waits with «while (!(LSR & 0x20)); THR = c;» to write and with «while (!(LSR & 1)); c = RBR;» to read. What is sent leaves at once: the baud rate is accepted but never slows it.\n\nWith «Screen: Integrated», what is sent shows on its screen and what you type into the UART (click it while simulating) reaches RBR. With «TX and RX pins», each byte sent comes out on TX with TXV at 1 until the next edge (wire them to a Terminal's D and WE), and on each edge with RXV at 1 the byte on RX comes in (wire a Keyboard's D and AV, and its RE to RXR so no key is lost).\n\nIRQ is 1 while IIR has a cause enabled in IER: data received (bit 0), THR empty (bit 1) or line error (bit 2). CLR = 1 puts the registers back as at power-on.
