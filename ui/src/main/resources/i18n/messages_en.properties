description.component.breakpoint=Breakpoint: pauses the simulation when the input meets its condition.\n\nWith "Condition: Equal to" it pauses each time the input arrives at "Value"; with "Different from", each time the input changes to a value other than "Value" (a counter pauses at every count). If the input does not change, it does not pause again. An input with a Z or conflicting bit meets neither condition. "Value" is typed like a constant (0b1010, 0xFF, decimal or negative) and must fit the width. Switched off with "Active" it does nothing but stays in the circuit. The status bar says which breakpoint paused the simulation and with what value.
