logisimExport.note.missingPin=Connection “{1}” of {0} is wired, but the Logisim part does not have it: that connection is not exported.
logisimExport.note.clockTicks={0}: the Logisim clock counts ticks, not time; it gets {1} tick(s) high and {2} low.
logisimExport.note.ramEdge={0} writes on the falling edge: the Logisim RAM writes on the rising one.
logisimExport.note.ramWrite={0} writes while WE is 1: the Logisim RAM writes on the clock edge.
logisimExport.note.memoryContents={0} has initial contents or a linked file: Logisim does not keep them in the circuit (only a ROM''s).
logisimExport.note.memoryWords={0} has {1} words: in Logisim it gets {2} (a power of two).
logisimExport.note.signedness={0}: Logisim multiplies with sign only at 32 bits and divides without sign, so the result may change.
logisimExport.note.characterWidth={0} uses {1}-bit characters: the Logisim one uses 7-bit ASCII.
logisimExport.note.switchAsConstant={0} is inside a component: in Logisim it becomes a constant with its value {1}.
logisimExport.note.switchValue={0} is {1}: the Logisim input pin starts at 0, so the circuit starts differently until you change it.
logisimExport.note.terminalSize={0} has {1} rows and {2} columns: the Logisim TTY goes up to {3} × {4} and gets that size.
logisimExport.note.keyboardBuffer={0} holds {1} characters: the Logisim keyboard holds at most {2}.
logisimExport.note.looseWriteEnable={0} has WE unconnected: in VSim it never writes, but in Logisim a loose WE writes on every rising edge.
logisimExport.note.ramWithoutWriteEnable={0} shares its data on one pin: in Logisim it gets the combined bus, which has no WE and writes while OE = 0; with OE unconnected it never writes.
logisimExport.note.counterLoad={0} has LD connected: in Logisim, LD = 1 counts down while EN is not 0, instead of loading D.
logisimExport.note.looseBufferControl={0} has its control unconnected: in VSim its output is disconnected (Z); in Logisim it is an error (E).
logisimExport.note.unroutedPin=Connection “{1}” of {0} could not be joined to its net without touching other wires: it is left unconnected.
logisimExport.note.crowdedPart={0} does not fit near its place without touching other wires: it goes apart, below the circuit, joined by added wires (never to another net).
logisimExport.note.annotations=Logisim has no sticky notes or frames: {0} are left out.
