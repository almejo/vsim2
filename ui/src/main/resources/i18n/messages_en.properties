description.component.push-button=Push button: gives 1 only while you hold it down with the mouse; released, it goes back to 0.\n\nPress it with the selection tool while simulating, on the round cap. It goes back to 0 when the mouse button is released (anywhere), with Esc, when the window loses the focus and when the simulation is paused or restarted, so it never sticks. Pressing it is not an edit: it leaves no undo step, does not mark the file as modified and neither selects nor moves it (to move it, drag it by the handle on its left). The file does not keep its state: it always starts at 0.\n\nIt is 1 bit wide and rotates like the Switch. In the truth table and in "Create component" it counts as an input, like the Switch.

