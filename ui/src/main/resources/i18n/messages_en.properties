description.component.keyboard=Keyboard: a queue of bytes typed on the PC keyboard that the circuit reads on a clock edge, like Logisim's Keyboard.\n\nD always shows the first byte of the queue (0 when it is empty) and AV is 1 while there is something. On each CLK edge, with RE not 0 (unconnected counts as 1), the first byte leaves the queue. RE = 0 holds it still and CLR = 1 empties it at once. With "Tri-state", D lets go while RE is 0.\n\nTo type, click the Keyboard while simulating: it captures the keyboard until you press Esc (Shift+Esc sends the ESC byte). You type characters (UTF-8 or Latin-1), Enter, Backspace, Tab and, with "Arrows as sequences", the arrows, Home, End, Delete and F1-F12 as VT100/xterm sequences; without that option the arrows, Home, End and Delete edit the queue as in Logisim. Ctrl+V pastes text. "Initial text" fills the queue on start or restart. Typing is not an edit: it leaves no undo step.
