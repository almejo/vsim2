description.component.terminal=Terminal: a text screen of rows by columns that the circuit writes one byte at a time, like Logisim's TTY.\n\nOn the CLK edge "Edge" chooses (rising unless changed), with WE = 1, the byte on D is written at the cursor. A D with a bit at Z or in conflict writes "?", like Logisim. CLR = 1 clears the screen and the history at once and wins over the clock. Unconnected, WE counts as 1 (it writes without wiring it) and CLR as 0.\n\nD has 7 or 8 bits as "Data width" says; with 8 bits, bytes from 128 on are read as UTF-8 or Latin-1 ("Encoding"). The part's size follows "Rows", "Columns" and "Font size". Changing the rows, the columns or how bytes are read keeps the text; changing colours, font or cursor never touches the screen. "Restart" leaves it empty.\n\n"Stop on receiving": when the received text ends with that text, the simulation stops as at a breakpoint; it stops again when more text arrives that ends the same way.\n\n"Character generator: External memory" adds CODE and ROW (outputs, on the right) and PIX (input): the Terminal draws each character with the 8 × 8 dots a ROM gives it. For each new code on the screen it sets CODE = the code and ROW = 0 to 7, and reads PIX at the end of each "Read time"; bit 7 of PIX is the leftmost dot. With a 2K × 8 ROM, address = code × 8 + row (CODE on A[10:3], ROW on A[2:0]). Codes the ROM has not given yet use the built-in font. "Reread the character ROM" (context menu) reads them again.
description.component.terminal.profile.logisim=Profile "Logisim (LRV32IM)": it behaves exactly like Logisim 2.7's TTY. 7-bit D; CR and LF start a new line, Backspace erases the row's last character, Ctrl-L clears the screen, and Tab and Esc are ignored. With the Logisim "Mode", also, WE lets it write unless it is exactly 0 and CLR clears only with a 1, as in Logisim.
description.component.terminal.profile.vt=Profile "VT100‑xterm" (the one of new parts): 8-bit UTF-8 D, a cursor moved by VT100/xterm escape sequences (cursor moves, erasing, colours with ESC[31m…), tab stops every 8 columns and 1000 rows of history.
description.component.terminal.profile.teletype=Profile "Teletype": like VT100‑xterm, but as on paper: nothing moves the cursor to an earlier row, so everything printed stays in the history (10 000 rows). 7-bit D, and Ctrl-L feeds a line instead of clearing.
