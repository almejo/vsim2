# --- Descripciones ---
# The «Descripción» box of Propiedades, the palette tooltip (first paragraph) and the AI's
# describe_component: description.component.<type or preset id> is the base text,
# description.component.<type id>.<parameter>.<value> a paragraph added for that value.
# Paragraphs are separated by \n\n. Every palette type and preset needs a base text (DescriptionsTest).
properties.description.title=Description
action.editDescription=Edit description…
command.changeDescription=change description
template.dialog.description=Description (optional): what it does and assumes, shown in Properties
library.description.title=Component description
library.description.message=Description of "{0}" (shown in Properties):
description.component.and=AND: the output is 1 only when every input is 1.\n\nWith "Width (bits)" above 1 it works bit by bit and all its pins are buses of that width. An input in Z (unconnected) does not count: the gate works with the others, and when all of them are in Z the output is Z. "Inputs" goes from 2 to 8. The output changes "Delay" time units after an input changes.
description.component.or=OR: the output is 1 when at least one input is 1.\n\nWith "Width (bits)" above 1 it works bit by bit and all its pins are buses of that width. An input in Z (unconnected) does not count: the gate works with the others, and when all of them are in Z the output is Z. "Inputs" goes from 2 to 8. The output changes "Delay" time units after an input changes.
description.component.xor=XOR: the output is 1 when an odd number of inputs are 1 (odd parity); with two inputs, when they differ.\n\nWith "Width (bits)" above 1 it works bit by bit and all its pins are buses of that width. An input in Z (unconnected) does not count: the gate works with the others, and when all of them are in Z the output is Z. "Inputs" goes from 2 to 8. The output changes "Delay" time units after an input changes.
description.component.nand=NAND: the output is 0 only when every input is 1; it is an AND with "Negate output".\n\nWith "Width (bits)" above 1 it works bit by bit and all its pins are buses of that width. An input in Z (unconnected) does not count: the gate works with the others, and when all of them are in Z the output is Z. "Inputs" goes from 2 to 8. The output changes "Delay" time units after an input changes.
description.component.nor=NOR: the output is 1 only when every input is 0; it is an OR with "Negate output".\n\nWith "Width (bits)" above 1 it works bit by bit and all its pins are buses of that width. An input in Z (unconnected) does not count: the gate works with the others, and when all of them are in Z the output is Z. "Inputs" goes from 2 to 8. The output changes "Delay" time units after an input changes.
description.component.xnor=XNOR: the output is 1 when an even number of inputs are 1 (even parity); with two inputs, when they are equal. It is an XOR with "Negate output".\n\nWith "Width (bits)" above 1 it works bit by bit and all its pins are buses of that width. An input in Z (unconnected) does not count: the gate works with the others, and when all of them are in Z the output is Z. "Inputs" goes from 2 to 8. The output changes "Delay" time units after an input changes.
description.component.buffer=Buffer: copies its input to the output.\n\nUse it to delay a signal by "Delay" time units. With "Width (bits)" above 1 it copies a whole bus. A bit in Z comes out in Z.
description.component.not=NOT: inverts its input (0 gives 1 and 1 gives 0); it is a Buffer with "Negate output".\n\nWith "Width (bits)" above 1 it inverts every bit of a bus. A bit in Z comes out in Z. The output changes "Delay" time units after the input.
description.component.tri-state=Tri-state buffer: with the control input at 1 the output copies the input; otherwise the output is Z (it lets go of the wire).\n\nWith "Width (bits)" above 1 the input and the output are buses of that width and the control (at the bottom, 1 bit) switches the whole bus on or off. With "Negate output" the output is the input inverted bit by bit while it is on (this is the Controlled inverter); off it is still Z. A control input that is unconnected, in Z or in conflict counts as off. So several tri-state buffers can drive the same wire, as long as only one is on at a time: two on with different values are a short circuit. The output changes "Delay" time units after an input.
description.component.flip-flop-data=D flip-flop: stores one bit. On the falling edge of the clock (when it goes from 1 to 0), Q takes the value D has at that moment and Q̅ (under Q) the opposite.\n\nBetween edges D can change without effect. It starts with Q = 0 and Q̅ = 1. Q and Q̅ change "Delay" time units after the edge. When D is in Z at the edge, Q and Q̅ become Z. Only a direct step from 1 to 0 counts: a clock that goes through Z gives no edge.
description.component.flip-flop-data.showInverted.false="Show Q̅" off: there is no Q̅, only D, Q and the clock. D flip-flops of circuits saved before Q̅ existed open this way, so a wire running straight down from Q is not joined to Q̅. If you turn it on, check that no wire passes over the point right under Q.
description.component.flip-flop-jk=JK flip-flop: stores one bit. On the falling edge of the clock (1 to 0) it looks at J and K: J = 0 and K = 0 keeps it, J = 0 and K = 1 sets it to 0, J = 1 and K = 0 sets it to 1, and J = 1 and K = 1 inverts it. Q̅ is the opposite of Q.\n\nBetween edges J and K can change without effect. It starts with Q = 0 and Q̅ = 1. Q and Q̅ change "Delay" time units after the edge. When J or K is in Z (unconnected) or in conflict at the edge, Q and Q̅ become Z until an edge with J different from K. Only a direct step from 1 to 0 counts: a clock that goes through Z gives no edge.
description.component.flip-flop-t=T flip-flop: stores one bit and inverts it when asked. On the falling edge of the clock (1 to 0), with T = 1 Q is inverted; with T = 0 it stays. Q̅ is the opposite of Q.\n\nWith T at 1, Q changes on every edge: it divides the clock frequency by 2 and makes counters. It starts with Q = 0 and Q̅ = 1. Q and Q̅ change "Delay" time units after the edge. An unconnected T does not count as 1: when T is in Z or in conflict at the edge, Q and Q̅ become Z, and since inverting Z gives Z, they stay so until "Restart". Only a direct step from 1 to 0 counts: a clock that goes through Z gives no edge.
description.component.flip-flop-sr=SR flip-flop: stores one bit. On the falling edge of the clock (1 to 0) it looks at S (set to 1) and R (reset to 0): S = 0 and R = 0 keeps it, S = 1 and R = 0 sets it to 1, and S = 0 and R = 1 sets it to 0. Q̅ is the opposite of Q.\n\nS = 1 and R = 1 together is the forbidden state: Q and Q̅ both become 0 (what a latch made of NOR gates shows), so Q̅ is no longer the opposite of Q. They stay so until an edge with S different from R; S = 0 and R = 0 keeps them.\n\nIt starts with Q = 0 and Q̅ = 1. Q and Q̅ change "Delay" time units after the edge. When S or R is in Z (unconnected) or in conflict at the edge, Q and Q̅ become Z. Only a direct step from 1 to 0 counts: a clock that goes through Z gives no edge.
description.component.clock=Clock: a square wave that changes by itself while simulating.\n\nIt starts at 0: it stays at 0 for "Time low" time units, then at 1 for "Time high" units, and so on. Each fall from 1 to 0 is the edge the D, JK, T and SR flip-flops, the register, the counter and the RAM use.
description.component.switch=Switch: gives 1, 0 or Z; a click changes it while simulating.\n\n"Value" is what it gives. A click goes from 1 to 0 and from 0 to 1; from Z it goes to 1. It changes with no delay, and the click changes "Value" too: it marks the file as modified and Ctrl+Z undoes it (several clicks in a row on the same switch are undone together).\n\nWith "Width (bits)" above 1 it is a row of bits (the most significant on the left) with a single bus output. "Value" is then a number (0b..., 0x... or decimal) that fits the width; there is only 0 and 1, no Z. A click on a bit changes just that bit; hovering shows the value in binary, hexadecimal and decimal. "Numbers" chooses how the number is read. Rotating it moves the output to another side and the row stays upright.
description.component.switch.signedness.signed="Numbers: Signed": "Value" also accepts a negative decimal (at 8 bits, from −128 to −1; −1 is 0xFF), and the decimal that is read is the two's complement one, the top bit being the sign (0xFF is −1). With 1 bit there is no sign.
description.component.constant=Constant: always gives the same value, of "Width (bits)" bits.\n\nThe value is set once, when the simulation starts, and a click does not change it. It is written in binary (0b1010), hexadecimal (0xFF) or decimal, also negative in two's complement (-3); a value that does not fit the width is refused. "Show as" only changes how it looks.
description.component.led=LED: lights up when its input is 1.\n\nWith 0 or Z (unconnected) it stays off. "Color" only changes how it looks.\n\nWith "Width (bits)" above 1 it is a row of lights, one per bit (the most significant on the left), with a single bus input. A light is on only for 1: with 0, Z or a conflict it stays off. Hovering shows which bit it is and the value. Rotating it moves the input to another side and the row stays upright.
description.component.seven-segments-display=7-segment display: shows one hexadecimal digit, 0 to F, from 4 bits.\n\nThe 4 bits come in through the top pins (the rightmost one is bit 0) or through the 4-bit bus at the bottom. When the bus brings any bit that is not Z, the bus is shown; when it is all Z or unconnected, the top pins are. A digit with a bit in Z or in conflict shows a dash.
description.component.seven-segments-display-double=Double 7-segment display: shows two hexadecimal digits, 00 to FF, from 8 bits.\n\nThe 8 bits come in through the top pins (the rightmost one is bit 0) or through the 8-bit bus at the bottom. When the bus brings any bit that is not Z, the bus is shown; when it is all Z or unconnected, the top pins are. A digit with a bit in Z or in conflict shows a dash.
description.component.time-diagram=Timing diagram: draws how its 4 inputs change over time.\n\nIt takes a sample every "Sample interval" time units and keeps the last "History (samples)": a pulse shorter than the interval may not show. Z is drawn as a line in the middle and a conflict in red.
description.component.input-pin=Input pin: when you create a component it becomes one of its inputs; while you try the circuit it works as a switch.\n\nIts label is the pin name and "Width (bits)" its width (a bus when wider than 1). On a bus, double click it to type its value. "Value" is what it gives at the start (1, 0 or Z in all its bits).
description.component.output-pin=Output pin: when you create a component it becomes one of its outputs; while you try the circuit it shows its value like an LED.\n\nIts label is the pin name and "Width (bits)" its width (a bus when wider than 1). On a bus, the value is written in the "Show as" format.
description.component.bus-splitter=Bus splitter: splits a bus of "Width (bits)" bits into one wire per bit.\n\nThe bus comes in at the top left and bit 0 leaves through b0, the topmost pin. It copies with no delay; a bit in Z comes out in Z.
description.component.bus-joiner=Bus joiner: joins one wire per bit into a bus of "Width (bits)" bits.\n\nBit 0 comes in through b0, the topmost pin, and the bus leaves at the top right. It joins with no delay; a bit in Z (unconnected) stays Z on the bus.
description.component.tunnel-in=Tunnel (entrance): joins wires by name without drawing them. The signal reaching this entrance comes out of every exit with the same name in this circuit.\n\nEach name has a single entrance, and its exits take its colour. It carries a wire or a whole bus. Names do not cross the edge of a user component.
description.component.tunnel-out=Tunnel (exit): delivers the signal of the entrance with the same name in this circuit (a wire or a whole bus).\n\nIt takes its entrance's colour; without an entrance it is grey and shows in Problems.
description.component.adder=Adder: adds A + B + Cin; S is the result and Cout the carry out of the top bit.\n\nS is as wide as "Width (bits)": what does not fit is lost and the sum wraps around. Cin comes in at the top and Cout leaves at the bottom. An unconnected Cin counts as 0. When A or B has a bit in Z or in conflict, or Cin is in conflict, S and Cout are Z. The outputs change "Delay" time units after an input.
description.component.alu=ALU: combines A and B as OP (3 bits) says and shows the operation inside.\n\nOP: 000 A + B, 001 A − B, 010 A AND B, 011 A OR B, 100 A XOR B, 101 NOT A, 110 A << 1, 111 A >> 1 (logical). Y is the result; Z = 1 when Y is 0, N is the top bit of Y, C is the carry of an addition, the borrow of a subtraction (1 when A < B unsigned) or the bit shifted out, and V the signed overflow of an addition or subtraction (C and V are 0 in the other operations).\n\nWhen OP, or an operand the operation reads, has a bit in Z or in conflict, every output is Z and the body shows "?". The outputs change "Delay" time units after an input.
description.component.comparator=Comparator: compares A with B; exactly one of the outputs A<B, A=B and A>B is 1.\n\n"Numbers" says whether A and B are read unsigned or signed. When A or B has a bit in Z or in conflict, the three outputs are Z. The outputs change "Delay" time units after an input.
description.component.mux=Multiplexer: lets one of its inputs through. Y = D0 when S = 0 and D1 when S = 1.\n\nWith 4 or 8 inputs, S has 2 or 3 bits and picks D0 to D3 or D7. Only the picked input matters: when it or S has a bit in Z or in conflict, Y is Z. Y changes "Delay" time units after an input.
description.component.decoder=Decoder: turns on a single output, the Y numbered A.\n\nWith EN = 1, output number A is 1 and the others 0; with EN = 0 they are all 0, even when A is undefined. An unconnected EN counts as 1. When A has a bit in Z or in conflict with EN = 1, or EN is in conflict, every output is Z. "Input bits" goes from 1 to 4 (2 to 16 outputs). The outputs change "Delay" time units after an input.
description.component.demux=Demultiplexer: sends D to one of its outputs, the Y numbered S.\n\nThe picked output equals D and every other output is 0. With "Outputs" = 2, 4 or 8, S has 1, 2 or 3 bits. When S has a bit in Z or in conflict, every output is Z; when only D is undefined, the picked output is Z and the others stay 0. The outputs change "Delay" time units after an input.
description.component.priority-encoder=Priority encoder: tells which is the highest input that is 1.\n\nA is the index of the highest input I at 1 and V ("valid") is 1; when none is 1, A = 0 and V = 0 (V tells that case apart from "input 0 is 1"). An unconnected input counts as 0. Inputs are read from the highest down: an input in conflict or undefined only matters when no higher one is 1, and then A and V are Z. "Inputs" is 2, 4, 8 or 16. The outputs change "Delay" time units after an input.
description.component.register=Register: stores a value of "Width (bits)" bits.\n\nOn the falling edge of CLK (1 to 0), with EN = 1, Q takes D (Z when D has a bit in Z or in conflict). CLR = 1 clears it to 0 at once, without waiting for the clock. Unconnected, EN counts as 1 and CLR as 0; a conflict on EN or CLR keeps the value. It starts at 0 and Q changes "Delay" time units later.\n\nThe body shows the value in the "Show as" format; in binary the digits come in groups of 4. Over 16 bits the binary value takes two lines (the highest bit top left) and the register is one unit taller, so EN, CLR and CLK move one unit down.
description.component.counter=Counter: counts up.\n\nOn the falling edge of CLK (1 to 0): with LD = 1 it loads D; otherwise, with EN = 1 it adds 1 (after the maximum it goes back to 0). CLR = 1 clears it to 0 at once. C ("terminal count") is 1 while Q is all ones and EN = 1, to chain counters. Unconnected, LD and CLR count as 0 and EN as 1; a conflict on LD, EN or CLR keeps the count. It starts at 0, Q changes "Delay" time units later and the body shows the count in the "Show as" format.
description.component.ram=RAM: a table of numbered words that is read and written; a word's number is its address.\n\nReading: Q shows word number A "Delay" time units after A changes, without waiting for the clock.\n\nWriting "With clock": on the falling edge of CLK (1 to 0), with WE = 1 and CS = 1, word A takes the value of D. A, D, WE and CS are read at that moment.\n\nUnconnected, CS counts as 1 and WE as 0: it works without wiring CS and a forgotten WE never writes. With CS = 0 it does not write and Q is Z; a conflict on CS makes Q Z and writes nothing, and a conflict on WE writes nothing. An address with a bit in Z or in conflict reads as Z (every bit) and writes nothing. A D with a bit in Z or in conflict is stored as a word in Z, which reads as Z until it is written again.\n\nIt starts with its initial contents, those of the contents editor (double click). Making "Words" or "Width (bits)" smaller never deletes the contents: what does not fit is kept, hidden, and shows again when the memory grows. Inside a user component, the memory starts with the words saved in the component (a link to a file does not travel inside).
description.component.rom=ROM: a table of numbered words that is only read; a word's number is its address.\n\nQ shows word number A "Delay" time units after A changes (it has no clock). With CS = 0, or a conflict on CS, Q is Z; unconnected, CS counts as 1. An address with a bit in Z or in conflict reads as Z (every bit).\n\nIts contents are written in the contents editor (double click) or come from a linked file; the simulation never changes them. Making "Words" or "Width (bits)" smaller never deletes the contents: what does not fit is kept, hidden, and shows again when the memory grows. Inside a user component, the memory starts with the words saved in the component (a link to a file does not travel inside).
description.component.comparator.signedness.signed="Numbers: Signed": A and B are read in two's complement, the top bit being the sign (at 8 bits, 0xFF is −1, less than 0).
description.component.ram.write.level="Writing: Without clock": there is no CLK. Word A takes the value of D all the time WE = 1 and CS = 1: when A or D change meanwhile, the new address or the new value is written.
description.component.ram.data.shared="Data: Single D bus": there is no Q; D is a single two-way pin. The RAM puts word A on D only with CS = 1 and WE = 0 (an unconnected WE counts as 0) and lets go of it (Z) at once otherwise, so another circuit can put the data to write. Several memories or a register can share the same bus.
description.component.ram.connection.pins="Connection: Loose pins": A, D and Q have one 1-bit pin per bit (A0, A1…, bit 0 first). A single bit in Z or in conflict makes the whole word count as undefined.
description.component.rom.connection.pins="Connection: Loose pins": A and Q have one 1-bit pin per bit (A0, A1…, bit 0 first). A single bit of A in Z or in conflict makes the address count as undefined.
description.component.ram.link.set=Linked to a file: the initial contents come from that file, and VSim reads it again when it changes. VSim never writes the file (edit it in the external editor); what the simulation writes stays only in the simulated memory.
description.component.rom.link.set=Linked to a file: the contents come from that file, and VSim reads it again when it changes. VSim never writes the file: edit it in the external editor.
description.component.subtractor=Subtractor: computes A − B − Bin; D is the difference and Bout is 1 when the result, read unsigned, needed a borrow (A is less than B + Bin).\n\nD has the width chosen in "Width (bits)": what does not fit is lost and the subtraction wraps around (0 − 1 gives all ones). Bin enters on top and Bout leaves at the bottom. An unconnected Bin is 0. When A or B has a bit in Z or in conflict, or Bin is in conflict, D and Bout are Z. The outputs change "Delay" time units after an input.
description.component.negator=Negator: Y is A with its sign changed, in two's complement (−A).\n\nAt 8 bits, 5 gives 251 (0xFB, which is −5), 0 gives 0 and −128 (0x80) gives −128 again, because +128 does not fit. When A has a bit in Z or in conflict, Y is Z. The output changes "Delay" time units after A.
description.component.multiplier=Multiplier: multiplies A by B. The product takes twice the bits, so it comes out in two halves of the chosen width: P is the low half and H the high half.\n\nFor example, at 8 bits 200 × 100 = 20000 = 0x4E20: P is 0x20 and H is 0x4E. Nothing is lost or wraps around, also at 32 bits. "Numbers" chooses how A and B are read. When A or B has a bit in Z or in conflict, P and H are Z. The outputs change "Delay" time units after an input.
description.component.multiplier.signedness.unsigned="Numbers: Unsigned": A and B are positive numbers from 0 to 2^N − 1.
description.component.multiplier.signedness.signed="Numbers: Signed": A and B are read in two's complement. P and H are the 2N-bit product, also in two's complement: −1 × −1 gives 1 (P = 1, H = 0) and −1 × 2 gives −2 (P = 0xFE and H = 0xFF at 8 bits).
description.component.divider=Divider: divides A (the dividend) by B (the divisor). Q is the quotient, R the remainder and E flags a division by zero.\n\nIt is an integer division: 250 ÷ 7 gives Q = 35 and R = 5. When B is 0 there is nothing to divide: Q is 0, R is A and E is 1 (otherwise E is 0). "Numbers" chooses how A and B are read. When A or B has a bit in Z or in conflict, Q, R and E are Z. The outputs change "Delay" time units after an input.
description.component.divider.signedness.unsigned="Numbers: Unsigned": A and B are positive numbers from 0 to 2^N − 1.
description.component.divider.signedness.signed="Numbers: Signed": A and B are read in two's complement. The quotient is truncated toward zero and the remainder takes the dividend's sign, as in Java or C: −7 ÷ 2 gives Q = −3 and R = −1. The case −128 ÷ −1 at 8 bits would give +128, which does not fit: Q wraps around to −128, with R = 0 and E = 0.
description.component.shifter=Shifter: moves the bits of A to one side as many positions as S says (an unsigned number); Y is the result.\n\nS has just the bits needed to count from 0 to N − 1 (3 bits for 8). With S = 0, Y equals A. Tying S to a Constant gives a fixed shift; for example x >> 1 is a right shifter with S = 1. When the width is not a power of 2, S can be N or more: shifts push every bit out (the arithmetic one leaves copies of the sign) and rotations go around full turns (modulo N). When A or S has a bit in Z or in conflict, Y is Z. The output changes "Delay" time units after an input.\n\nThe symbols are Verilog's: >> is the logical shift (zeros come in) and >>> the arithmetic one (the sign comes in), the opposite of Java and JavaScript.
description.component.shifter.shiftType.logical-left="Type: Logical left" (<<): the bits move up S positions, the top bits are lost and zeros come in on the right. It is the same as multiplying by 2^S.
description.component.shifter.shiftType.logical-right="Type: Logical right" (>>): the bits move down S positions, the low bits are lost and zeros come in on the left. It is the same as an unsigned division by 2^S.
description.component.shifter.shiftType.arithmetic-right="Type: Arithmetic right" (>>>): the bits move down S positions, but a copy of the top bit (the sign) comes in instead of zeros, so a negative two's complement number stays negative.
description.component.shifter.shiftType.rotate-left="Type: Rotate left": the bits move up S positions and the ones leaving at the top come back in on the right; none is lost.
description.component.shifter.shiftType.rotate-right="Type: Rotate right": the bits move down S positions and the ones leaving at the bottom come back in on the left; none is lost.
description.component.bit-counter=Ones counter: Y is how many of the bits of A are 1.\n\nY has just the bits needed to count from 0 to N (4 bits for 8): with A = 0 it gives 0 and with every bit at 1 it gives N. It is useful, for example, to find the parity or the weight of a word. When A has a bit in Z or in conflict, Y is Z. The output changes "Delay" time units after A.
description.component.inverter-controlled=Controlled inverter: with the control input at 1 the output is the inverted input (0 gives 1 and 1 gives 0); otherwise the output is Z (it lets go of the wire). It is a Tri-state buffer with "Negate output".\n\nWith "Width (bits)" above 1 it inverts every bit of a bus and the control (at the bottom, 1 bit) switches the whole bus on or off. A control input that is unconnected, in Z or in conflict counts as off. Several can drive the same wire if only one is on at a time. The output changes "Delay" time units after an input.
description.component.bit-extender=Bit extender: changes the width of a bus; the input "in" has "Input width" bits and the output "out" has "Output width" bits.\n\nIf the output is wider, the new upper bits are zeros or copies of the input's top bit, depending on "Fill". If it is narrower only the low bits are kept and the upper ones are lost, whatever the fill (from 8 bits to 3 the lowest 3 stay). It is only wiring: no delay. If any input bit is Z or in conflict, the whole output is Z.
description.component.bit-extender.fill.zeros="Fill: Zeros": the new bits are 0; it suits unsigned numbers (11110101 goes from 8 to 16 bits as 0000000011110101).
description.component.bit-extender.fill.sign="Fill: Sign": the new bits copy the input's top bit; it suits two's complement signed numbers (11110101, which is -11, goes from 8 to 16 bits as 1111111111110101, still -11).
description.component.bit-selector=Bit selector: takes from the input "in" group number S of "Output width" bits; group 0 is the low bits.\n\nFor example an 8-bit bus with a 4-bit output has 2 groups: S = 0 gives the low 4 bits and S = 1 the high 4. S has just enough bits to number the groups (at least 1). If the last group is not complete, the missing bits are 0; an S that points at a group that does not exist gives all 0. If "in" or S has any bit in Z or in conflict (an unconnected S too), "out" is Z. The output changes "Delay" time units after an input.

