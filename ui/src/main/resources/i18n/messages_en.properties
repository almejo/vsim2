# Matriz LED
component.led-matrix=LED Matrix
description.component.led-matrix=LED matrix: a grid of one-bit LEDs, to draw letters, shapes and games. It has 1 to 32 rows and 1 to 64 columns (8 × 8 by default).\n\n"Input: By rows" gives one pin per row (F0, F1…) with as many bits as columns: what arrives is what you see, the most significant bit on the left. "Input: Scan" gives three pins, like a real matrix: "Fila" (which row), "Datos" (its columns) and "Hab." (enable); with "Hab." at 1 the chosen row takes the data and keeps it until the scan passes it again. With "Hab." at 0, Z or unconnected, or a "Fila" in Z or beyond the matrix, nothing changes. A row nobody has written is off.\n\nA bit in Z (or a row in conflict) shows off with a ring in the "unknown" colour. "Appearance" picks Round, Pixel, 8×8 module or Sign, "Color" the colour of the LEDs, "Show unlit" draws the off ones dimly and "Fading glow" lets an LED that just went off fade out slowly (on screen only, it does not change the simulation).
