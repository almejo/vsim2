help.component.tunnel-in=Joins wires by name without drawing them: the signal reaching this entrance comes out of every exit with the same name in this circuit. Each name has a single entrance, and its exits take its colour.
help.component.tunnel-out=Delivers the signal of the entrance with the same name in this circuit (a wire or a whole bus). It takes its entrance's colour; without an entrance it is grey and shows in Problems.
