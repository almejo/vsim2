[versions]
jackson = "2.18.2"
slf4j = "2.0.16"
logback = "1.5.16"
junit = "5.11.4"
assertj = "3.27.3"
flatlaf = "3.5.4"
miglayout = "11.4.2"
jfreesvg = "5.0.7"
jfreepdf = "2.0.1"
pdfbox = "3.0.8"

[libraries]
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }
miglayout-swing = { module = "com.miglayout:miglayout-swing", version.ref = "miglayout" }
jfreesvg = { module = "org.jfree:org.jfree.svg", version.ref = "jfreesvg" }
jfreepdf = { module = "org.jfree:org.jfree.pdf", version.ref = "jfreepdf" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
